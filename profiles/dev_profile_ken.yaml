mcu: 
  alias: Arduino R4 Wifi
  component_name: arduinoR4wifi # Name of component to use in HAL
  dev: /dev/tty.usbmodemF412FA68D6802
  #dev: /dev/serial/by-id/usb-Arduino_UNO_WiFi_R4_CMSIS-DAP_F412FA68D680-if01
  enabled: true
  hal_emulation: true
  #connection: 
  #  baudrate: 9600
  io_map:
        
        
    digitalInputs:
      - pin_id: 2
        pin_name: din.2 #hal pin name
        input_pullup: true
        pin_debounce: 5
      - pin_id: 3
        pin_name: din.3 #hal pin name
        input_pullup: true
        pin_debounce: 5
    digitalOutputs:
      - pin_id: 4
        pin_name: dout.4 #hal pin name
      - pin_id: 5
        pin_name: dout.5 #hal pin name
    analogInputs:
      - pin_id: A1
        pin_name: ain.1 #hal pin name           #optional
        pin_type: HAL_FLOAT #hal pin type     #optional    
        pin_smoothing: 200 #smoothing const   #optional
        pin_smoothing_algo: SIMPLE #optional, SIMPLE, EXPONENTIAL, MOVING
        pin_min_val: 10 #minimum value         #optional
        pin_max_val: 4096 #maximum value      #optional
        pin_resolution: 12  #optional, some boards support analogReadResolution(X) to set a different resolution
        pin_connected_state: 32 #optional, value to set the pin to when the board is connected
        pin_disconnected_state: 64 #optional, value to set the pin to when the board is disconnected
    analogOutputsDisabled:
      - pin_id: A2
        pin_name: aout.2 #hal pin name
        pin_type: HAL_FLOAT #hal pin type
        pin_smoothing: 200 #smoothing const   #optional
        pin_min_val: 0 #minimum value         #optional     these could be used to convert the value to 0-10 for example
        pin_max_val: 1023 #maximum value      #optional 
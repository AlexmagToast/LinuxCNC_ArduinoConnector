mcu: 
  alias: Arduino R4 Wifi
  component_name: arduinoR4wifi # Name of component to use in HAL
  #dev: /dev/tty.usbmodemF412FA68D6802
  dev: /dev/serial/by-id/usb-Arduino_UNO_WiFi_R4_CMSIS-DAP_F412FA68D680-if01
  enabled: true
  hal_emulation: false
  #connection: 
  #  baudrate: 9600
  io_map:
        
        
    digitalInputs:
      - pin_id: 2
        pin_name: din.2 #hal pin name
        input_pullup: true
        pin_debounce: 5
      - pin_id: 3
        pin_name: din.3 #hal pin name
        input_pullup: true
        pin_debounce: 5
    digitalOutputs:
      - pin_id: 4
        pin_name: dout.4 #hal pin name
      - pin_id: 5
        pin_name: dout.5 #hal pin name

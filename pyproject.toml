[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "linuxcnc_arduinoconnector"
version = "0.0.1"
description = "ArduinoConnector Alpha"
authors = [
    { name = "Alexander Richter", email= "info@theartoftinkering.com" },
    {name = "Ken Thompson", email = "kenthompson1@gmail.com"},
]
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "pyserial",
    "strenum",
    "crc8",
    "numpy",
    "msgpack",
    "cobs",
    "pyyaml",
    "psutil", 
    "fastapi",
    "uvicorn",
    "requests",
    "textual"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx",
    "pytest-cov",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    "linuxcnc_arduinoconnector",
    "linuxcnc_arduinoconnector.config",
    "linuxcnc_arduinoconnector.utils",
    "linuxcnc_arduinoconnector.api",
    "linuxcnc_arduinoconnector.models",
    "linuxcnc_arduinoconnector.features",
    "linuxcnc_arduinoconnector.interfaces"
]

[tool.setuptools.package-data]
uspto_odp = ["py.typed", "*.pyi", "**/*.pyi"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/AlexmagToast/LinuxCNC_ArduinoConnector"
Issues = "https://github.com/AlexmagToast/LinuxCNC_ArduinoConnector/issues"
